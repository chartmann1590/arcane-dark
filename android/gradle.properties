org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin 2.4's incremental compilation cache (RelocatableFileToPathConverter) crashes when a
# module's sources (e.g. pub-cache-hosted plugins) live on a different path root than this
# project's relocated top-level build/ dir (see root android/build.gradle.kts newBuildDir).
# Disabling incremental compilation avoids the crash; full recompiles are slower but reliable.
kotlin.incremental=false
