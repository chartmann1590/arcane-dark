name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with --dart-define=STORE=amazon (no Google Play
# links, no Play in-app review prompt). Run on an emulator without Google Play services (like Fire).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: google-services.json from the app's own firebase_options.dart (same public client config)
      shell: bash
      run: |
        python3 - <<'PY'
        import re, json
        s = open('lib/firebase_options.dart').read()
        blk = s[s.index('static const FirebaseOptions android'):]
        blk = blk[:blk.index(');')]
        g = lambda k: re.search(k + r": *'([^']+)'", blk).group(1)
        app_id = g('appId')
        j = {"project_info": {"project_number": g('messagingSenderId'), "project_id": g('projectId'), "storage_bucket": g('storageBucket')},
             "client": [{"client_info": {"mobilesdk_app_id": app_id, "android_client_info": {"package_name": "com.arcane.dndai.dnd_ai"}},
                         "oauth_client": [], "api_key": [{"current_key": g('apiKey')}],
                         "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
             "configuration_version": "1"}
        open('android/app/google-services.json', 'w').write(json.dumps(j, indent=2))
        print('google-services.json written for', j['project_info']['project_id'])
        PY
    - name: Build amazon APK (store=amazon)
      shell: bash
      run: |
        set -o pipefail
        flutter pub get 2>&1 | tee -a /tmp/amz-build.log
        flutter build apk --release --dart-define=STORE=amazon --build-number=${{ github.run_number }}0 2>&1 | tee -a /tmp/amz-build.log
        mkdir -p amz-apk
        cp build/app/outputs/flutter-apk/app-release.apk amz-apk/ArcaneDark-amazon-release.apk
        ls -la amz-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs amz-apk/ArcaneDark-amazon-release.apk | head -3 || true
        $BT/aapt2 dump badging amz-apk/ArcaneDark-amazon-release.apk | head -3 || true
        unzip -l amz-apk/ArcaneDark-amazon-release.apk | grep "lib/" | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c || true
        echo "--- Play Store URL strings left in the amazon release:"; unzip -p amz-apk/ArcaneDark-amazon-release.apk 'classes*.dex' 'lib/x86_64/libapp.so' | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_ArcaneDark_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/ArcaneDark-amazon-release.apk
