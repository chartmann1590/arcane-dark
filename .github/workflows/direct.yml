name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.35.x  # the version this app was built with (pubspec.lock: flutter >=3.35.6; Gradle 8.12)
        cache: true
    - name: google-services.json from the app's own firebase_options.dart (same public client config)
      shell: bash
      run: |
        python3 - <<'PY'
        import re, json
        s = open('lib/firebase_options.dart').read()
        blk = s[s.index('static const FirebaseOptions android'):]
        blk = blk[:blk.index(');')]
        g = lambda k: re.search(k + r": *'([^']+)'", blk).group(1)
        app_id = g('appId')
        j = {"project_info": {"project_number": g('messagingSenderId'), "project_id": g('projectId'), "storage_bucket": g('storageBucket')},
             "client": [{"client_info": {"mobilesdk_app_id": app_id, "android_client_info": {"package_name": "com.arcane.dndai.dnd_ai"}},
                         "oauth_client": [], "api_key": [{"current_key": g('apiKey')}],
                         "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
             "configuration_version": "1"}
        open('android/app/google-services.json', 'w').write(json.dumps(j, indent=2))
        print('google-services.json written for', j['project_info']['project_id'])
        PY
    - name: Build direct APK (store=direct)
      shell: bash
      run: |
        set -o pipefail
        flutter pub get 2>&1 | tee -a /tmp/dsk-build.log
        flutter build apk --release --dart-define=STORE=direct --build-number=${{ github.run_number }}0 2>&1 | tee -a /tmp/dsk-build.log
        mkdir -p dsk-apk
        cp build/app/outputs/flutter-apk/app-release.apk dsk-apk/ArcaneDark-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/ArcaneDark-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/ArcaneDark-direct-release.apk | head -3 || true
        unzip -l dsk-apk/ArcaneDark-direct-release.apk | grep "lib/" | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c || true
        echo "--- Play Store URL strings left in the direct release:"; unzip -p dsk-apk/ArcaneDark-direct-release.apk 'classes*.dex' 'lib/x86_64/libapp.so' | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_ArcaneDark_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/ArcaneDark-direct-release.apk
